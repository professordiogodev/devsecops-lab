  # deploy:
  #   needs: [secrets, sast, sca, iac]
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   environment: producao          # aprovação manual + regras de proteção
  #   permissions:
  #     id-token: write              # permite pedir o token OIDC
  #     contents: read
  #   steps:
  #     - uses: actions/checkout@v4
